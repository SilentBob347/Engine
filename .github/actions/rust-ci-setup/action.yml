name: Rust CI setup
description: >-
  Installs the pinned toolchain and prepares the dependency cache, the compiler cache and full build
  parallelism shared by every Rust job.

inputs:
  cache-key:
    description: Rust dependency cache key shared by jobs that build the same set of targets.
    required: true
  fast-compile-infra:
    description: >-
      Build uc-infra without the opt-level 3 override from Cargo.toml. Only for jobs whose results do not
      depend on that optimization level, such as instrumented coverage.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        workspaces: . -> target
        shared-key: ${{ inputs.cache-key }}

    # rust-cache 只保留第三方依赖；工作区 crate 由 sccache 按内容缓存，未改动的 crate 跨运行复用。
    - name: Install compiler cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Configure compiler cache and build parallelism
      shell: bash
      run: |
        {
          echo "SCCACHE_GHA_ENABLED=true"
          echo "RUSTC_WRAPPER=sccache"
          # sccache 不缓存增量编译产物。
          echo "CARGO_INCREMENTAL=0"
          # .cargo/config.toml 为本地开发限制为 2 个并行编译任务；CI runner 专用于本次构建，恢复为全部逻辑核。
          echo "CARGO_BUILD_JOBS=default"
        } >> "$GITHUB_ENV"

    # Cargo.toml 为移动端开发构建把 uc-infra 设为 opt-level 3，测试构建因此多花一倍以上编译时间。
    # 诊断栈符号校验与真实网络、多设备时序都依赖该优化级别，只有已按 release 口径校验诊断栈的
    # 插桩覆盖率 job 恢复为 dev 默认值。
    - name: Compile uc-infra without the mobile optimization override
      if: inputs.fast-compile-infra == 'true'
      shell: bash
      run: |
        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$cargo_home"
        printf '\n[profile.dev.package.uc-infra]\nopt-level = 0\n' >> "$cargo_home/config.toml"
